[package]
name = "printkit-desktop"
version = "0.2.6"
description = "Local desktop console for the printkit service"
edition = "2021"
rust-version = "1.82"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "printkit_desktop_lib"
path = "src/lib.rs"

[[bin]]
name = "printkit-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = ["time", "sync"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
time = { version = "0.3", features = ["formatting"] }
ureq = { version = "3.5.1", default-features = false }
base64 = "0.23"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

# The desktop shell is a separate product: it must never join the printkit
# cargo workspace or link any printkit-* crate.
[workspace]
