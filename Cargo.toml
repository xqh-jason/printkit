[workspace]
members = ["crates/*", "plugins/*", "apps/*"]
exclude = ["apps/desktop"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/xqh-jason/printkit"
# None of these crates are published to crates.io; the binary is the product.
publish = false

[workspace.dependencies]
printkit-core = { path = "crates/core", default-features = false }
printkit-render = { path = "crates/render", default-features = false }
printkit-pdf = { path = "crates/pdf", default-features = false }
printkit-engine = { path = "crates/engine", default-features = false }
printkit-platform = { path = "crates/platform", default-features = false }
printkit-platform-mac = { path = "crates/platform-mac", default-features = false }
printkit-platform-win = { path = "crates/platform-win", default-features = false }
printkit-trace = { path = "crates/trace", default-features = false }
printkit-facade = { path = "crates/facade", default-features = false }
printkit-protocol = { path = "crates/protocol", default-features = false }
printkit-schema = { path = "crates/schema", default-features = false }
printkit-barcode = { path = "crates/barcode", default-features = false }
printkit-store = { path = "crates/store", default-features = false }
printkit-plugin-api = { path = "crates/plugin-api" }
printkit-plugin-host = { path = "crates/plugin-host" }

printkit-plugin-observability = { path = "plugins/observability" }
printkit-plugin-records = { path = "plugins/records" }

async-trait = "0.1"
serde_json = "1"
thiserror = "2"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
time = { version = "0.3", default-features = false, features = ["formatting", "serde", "serde-well-known", "std"] }
toml = "0.9"
tempfile = "3"
schemars = { version = "1", default-features = false, features = ["derive", "std"] }
serde_path_to_error = "0.1"
insta = { version = "1", default-features = false, features = ["json"] }
rxing = { version = "0.9.3", default-features = false, features = ["encoders", "oned", "qrcode", "pdf417", "datamatrix", "encoding_rs"] }
criterion = "0.8"
base64 = "0.23"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
lopdf = "0.47"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# TypeScript bindings for the published contracts. Optional everywhere: a
# release build carries neither the crate nor its macros.
ts-rs = { version = "11", default-features = false, features = ["serde-compat", "no-serde-warnings"] }

# HTTP/WS service face. No TLS features: the listener is loopback-only.
salvo = { version = "0.85", default-features = false, features = [
    "server",
    "server-handle",
    "http1",
    "websocket",
    "cookie",
    "affix-state",
] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "time", "macros"] }
rusqlite = { version = "0.43", default-features = false, features = ["backup"] }
sha2 = { version = "0.10", default-features = false }
getrandom = "0.3"
fs2 = "0.4"
windows = { version = "0.62.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
webview2-com = { version = "0.39.1", default-features = false }

block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    "NSBitmapImageRep",
    "NSButton",
    "NSClipView",
    "NSControl",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSScrollView",
    "NSView",
    "NSWindow",
    "objc2-core-foundation",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFData", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSData",
    "NSDate",
    "NSDictionary",
    "NSProcessInfo",
    "NSRunLoop",
    "NSString",
    "NSThread",
    "NSURL",
    "NSURLRequest",
    "NSValue",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "objc2-core-foundation",
    "WKWebView",
    "WKWebViewConfiguration",
    "WKPDFConfiguration",
    "WKNavigation",
    "WKNavigationAction",
    "WKNavigationDelegate",
    "WKPreferences",
    "WKWebpagePreferences",
    "WKSnapshotConfiguration",
] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
panic = "deny"
