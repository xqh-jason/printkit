[package]
name = "printkit-engine"
description = "Orchestration: parse, validate, render HTML, produce PDF, emit trace events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# Network access for `data.url` bodies. Optional so a build from the CLI with
# `--no-default-features` carries no TLS stack.
url-fetch = ["dep:reqwest", "dep:rustls"]

[dependencies]
bytes.workspace = true
futures.workspace = true
printkit-core.workspace = true
printkit-pdf.workspace = true
printkit-platform.workspace = true
printkit-render.workspace = true
printkit-store.workspace = true
printkit-trace.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true

[dev-dependencies]
base64.workspace = true
async-trait.workspace = true
lopdf.workspace = true
criterion.workspace = true
futures.workspace = true
tempfile.workspace = true
printkit-platform = { workspace = true, features = ["test-support"] }
printkit-pdf = { workspace = true, features = ["parse-count"] }

[[bench]]
name = "batch"
harness = false

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
