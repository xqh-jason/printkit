[package]
name = "printkit-protocol"
description = "Wire types of the printkit protocol: envelopes, method parameters and results, error and warning codes. Pure data, no IO."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# TypeScript bindings for the TypeScript SDK package. Off by default: a
# release build carries neither ts-rs nor its macros.
typescript = ["dep:ts-rs", "printkit-core/typescript"]

[dependencies]
printkit-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
ts-rs = { workspace = true, optional = true }

[lints]
workspace = true
